<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanza del Preside - Gestione Punti</title>
    <style>
        body {
            background-color: #1a120b;
            color: #f5edd8;
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #d4af37; }
        .box-admin {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #d4af37;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #2b1f14;
            border: 1px solid #d4af37;
            color: #f5edd8;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: #d4af37;
            color: #1a120b;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #fff; }
    </style>
</head>
<body>

    <h1>🧙‍♂️ La Stanza del Preside 🧙‍♂️</h1>
    <p>Pannello segreto per l'assegnazione dei punti del Torneo</p>

    <div class="box-admin">
        <div class="form-group">
            <label for="nickname">Soprannome Studente:</label>
            <input type="text" id="nickname" placeholder="Es. Tommaso" required>
        </div>

        <div class="form-group">
            <label for="casa">Casa di Appartenenza:</label>
            <select id="casa">
                <option value="grifondoro">Grifondoro</option>
                <option value="serpeverde">Serpeverde</option>
                <option value="corvonero">Corvonero</option>
                <option value="tassorosso">Tassorosso</option>
            </select>
        </div>

        <div class="form-group">
            <label for="punti">Punti (usa il segno - per toglierli):</label>
            <input type="number" id="punti" placeholder="Es. 10 oppure -5" required>
        </div>

        <div class="form-group">
            <label for="motivo">Motivazione (apparirà nella Gazzetta):</label>
            <textarea id="motivo" rows="3" placeholder="Es. Per aver risposto correttamente a lezione di Pozioni."></textarea>
        </div>

        <button onclick="aggiornaPunteggio()">Invia Aggiornamento Decreto</button>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script>
        // METTI LO STESSO LINK DI SUPABASE TRA LE VIRGOLETTE QUI SOTTO:
        const SUPABASE_URL = "https://rwxylxqhhnxmumcjahlm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_mA9sEGg7xeKy3mGB3KqLng_B4T4Bndy";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function aggiornaPunteggio() {
            const nicknameInput = document.getElementById('nickname').value.trim();
            const casaSelezionata = document.getElementById('casa').value;
            const puntiDaAggiungere = parseInt(document.getElementById('punti').value);
            const motivoTesto = document.getElementById('motivo').value.trim();

            if (!nicknameInput || isNaN(puntiDaAggiungere)) {
                alert("Per favore, inserisci un soprannome valido e i punti.");
                return;
            }

            let { data: studenteEsistente } = await supabase
                .from('studenti')
                .select('*')
                .eq('nickname', nicknameInput)
                .maybeSingle();

            let nuoviPunti = puntiDaAggiungere;

            if (studenteEsistente) {
                nuoviPunti = studenteEsistente.punti + puntiDaAggiungere;
                await supabase
                    .from('studenti')
                    .update({ punti: nuoviPunti })
                    .eq('nickname', nicknameInput);
            } else {
                await supabase
                    .from('studenti')
                    .insert([{ nickname: nicknameInput, casa: casaSelezionata, punti: nuoviPunti }]);
            }

            let simbolo = puntiDaAggiungere >= 0 ? "🟢" : "🔴";
            let azione = puntiDaAggiungere >= 0 ? "guadagnato" : "perso";
            let casaFormattata = casaSelezionata.charAt(0).toUpperCase() + casaSelezionata.slice(1);
            
            let messaggioFinale = `${simbolo} <b>${casaFormattata}:</b> ${nicknameInput} ha ${azione} ${Math.abs(puntiDaAggiungere)} punti. <i>${motivoTesto}</i>`;

            await supabase
                .from('cronologia')
                .insert([{ messaggio: messaggioFinale }]);

            alert(`Decreto Inviato! Punti aggiornati per ${nicknameInput}.`);
            
            document.getElementById('nickname').value = "";
            document.getElementById('punti').value = "";
            document.getElementById('motivo').value = "";
        }
    </script>
</body>
</html>
